[package]
name = "solver"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow = { version = "54", default-features = false }
memchr = "2.7"
mimalloc = "0.1"
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
